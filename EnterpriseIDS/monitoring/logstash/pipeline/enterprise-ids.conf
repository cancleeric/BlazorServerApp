input {
  # 從 Serilog 結構化日誌讀取
  beats {
    port => 5044
  }

  # 直接從日誌檔案讀取 (如果不使用 Filebeat)
  file {
    path => "/var/log/enterprise-ids/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["enterprise-ids", "file"]
  }

  # 從 HTTP 端點接收日誌
  http {
    port => 8080
    codec => "json"
    tags => ["enterprise-ids", "http"]
  }
}

filter {
  # 解析 Serilog JSON 格式
  if [fields][service] == "enterprise-ids" {
    json {
      source => "message"
    }

    # 提取時間戳記
    if [@timestamp] {
      date {
        match => [ "@timestamp", "ISO8601" ]
      }
    }

    # 解析日誌級別
    if [Level] {
      mutate {
        add_field => { "log_level" => "%{[Level]}" }
        lowercase => [ "log_level" ]
      }
    }

    # 提取來源資訊
    if [SourceContext] {
      mutate {
        add_field => { "logger" => "%{[SourceContext]}" }
      }
    }

    # 解析異常訊息
    if [Exception] {
      mutate {
        add_field => { "exception_message" => "%{[Exception]}" }
      }
      
      # 提取異常類型
      grok {
        match => { "exception_message" => "^(?<exception_type>[A-Za-z.]+Exception)" }
        tag_on_failure => ["_grokparsefailure_exception"]
      }
    }

    # 解析 HTTP 請求日誌
    if [RequestPath] {
      mutate {
        add_field => { "request_path" => "%{[RequestPath]}" }
        add_field => { "request_method" => "%{[RequestMethod]}" }
        add_field => { "status_code" => "%{[StatusCode]}" }
        add_field => { "response_time" => "%{[ElapsedMilliseconds]}" }
      }

      # 將回應時間轉換為數字
      if [response_time] {
        mutate {
          convert => { "response_time" => "integer" }
        }
      }
    }

    # 解析認證相關日誌
    if [UserId] or [TenantId] {
      mutate {
        add_field => { "user_id" => "%{[UserId]}" }
        add_field => { "tenant_id" => "%{[TenantId]}" }
      }
    }

    # 解析 LDAP 操作日誌
    if [LdapOperation] {
      mutate {
        add_field => { "ldap_operation" => "%{[LdapOperation]}" }
        add_field => { "ldap_result" => "%{[LdapResult]}" }
        add_field => { "ldap_duration" => "%{[LdapDuration]}" }
      }
    }

    # 標記安全事件
    if [message] =~ /(?i)(authentication.*failed|unauthorized|forbidden|security|attack|breach)/ {
      mutate {
        add_tag => ["security_event"]
      }
    }

    # 標記錯誤事件
    if [log_level] in ["error", "fatal"] {
      mutate {
        add_tag => ["error_event"]
      }
    }

    # 標記效能事件
    if [response_time] and [response_time] > 5000 {
      mutate {
        add_tag => ["performance_issue"]
      }
    }

    # 地理位置解析 (如果有 IP 地址)
    if [ClientIP] {
      geoip {
        source => "ClientIP"
        target => "geoip"
      }
    }
  }

  # 清理不需要的欄位
  mutate {
    remove_field => [ "@version", "host", "beat", "offset", "input", "prospector" ]
  }
}

output {
  # 輸出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "enterprise-ids-logs-%{+YYYY.MM.dd}"
    template_name => "enterprise-ids"
    template => "/usr/share/logstash/templates/enterprise-ids-template.json"
    template_overwrite => true
  }

  # 錯誤日誌單獨索引
  if "error_event" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "enterprise-ids-errors-%{+YYYY.MM.dd}"
    }
  }

  # 安全事件單獨索引
  if "security_event" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "enterprise-ids-security-%{+YYYY.MM.dd}"
    }
  }

  # 開發環境除錯輸出
  if [fields][environment] == "development" {
    stdout {
      codec => rubydebug
    }
  }
}