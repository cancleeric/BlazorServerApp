# NGINX 上游伺服器狀態監控配置
# 提供即時的負載平衡器狀態資訊

server {
    listen 8080;
    server_name localhost;
    
    # 限制存取來源
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        
        # 自訂狀態頁面
        add_header Content-Type text/plain;
    }
    
    # 上游伺服器狀態 (NGINX Plus 功能)
    location /upstream_status {
        # upstream_conf;
        # access_log off;
        
        # 開源版本替代方案
        return 200 "Upstream Status monitoring requires NGINX Plus\nFor basic status see /nginx_status\n";
        add_header Content-Type text/plain;
    }
    
    # 詳細的狀態 JSON API (NGINX Plus)
    location /api {
        # api write=on;
        # allow 127.0.0.1;
        # deny all;
        
        # 開源版本替代方案
        return 200 '{"message":"Advanced API monitoring requires NGINX Plus","basic_status":"/nginx_status"}';
        add_header Content-Type application/json;
    }
    
    # 自訂健康檢查端點
    location /load_balancer_health {
        access_log off;
        
        # 檢查上游伺服器可用性的簡單腳本
        proxy_pass http://health_check_backend/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        
        # 如果上游失敗，返回自訂錯誤
        error_page 502 503 504 = @upstream_down;
    }
    
    location @upstream_down {
        return 503 '{"status":"error","message":"Upstream servers unavailable","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
    
    # 負載平衡器配置資訊
    location /config_info {
        access_log off;
        return 200 '{
            "load_balancer": {
                "algorithm": "least_conn",
                "upstream_servers": [
                    {"server": "app1.enterpriseids.local:5000", "weight": 3},
                    {"server": "app2.enterpriseids.local:5000", "weight": 3},
                    {"server": "app3.enterpriseids.local:5000", "weight": 3},
                    {"server": "app4.enterpriseids.local:5000", "weight": 1, "backup": true}
                ],
                "health_check_interval": "10s",
                "max_fails": 3,
                "fail_timeout": "10s"
            },
            "ssl": {
                "protocols": ["TLSv1.2", "TLSv1.3"],
                "hsts_enabled": true,
                "session_cache": "shared:SSL:10m"
            },
            "rate_limiting": {
                "login": "5r/m",
                "api": "10r/s", 
                "general": "5r/s"
            },
            "version": "1.0",
            "last_updated": "$time_iso8601"
        }';
        add_header Content-Type application/json;
    }
}