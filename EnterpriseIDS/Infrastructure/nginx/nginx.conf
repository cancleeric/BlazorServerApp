# NGINX 高可用性負載平衡器配置
# Enterprise Identity Server - Production Load Balancer

# 主配置區段
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 事件處理配置
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# HTTP 配置區段
http {
    # 基本設定
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 日誌格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr"'
        '}';
    
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/analytics.log json_analytics;
    
    # 效能優化設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 緩衝區設定
    client_body_buffer_size 16K;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_max_body_size 50M;
    
    # 超時設定
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    
    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # Rate Limiting 配置
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;
    
    # 上游服務器群組 - Enterprise Identity Server 實例
    upstream enterprise_identity_backend {
        # 負載均衡演算法：weighted round-robin
        # 可選：least_conn、ip_hash、hash
        least_conn;
        
        # 主要應用伺服器實例
        server app1.enterpriseids.local:5000 weight=3 max_fails=3 fail_timeout=10s;
        server app2.enterpriseids.local:5000 weight=3 max_fails=3 fail_timeout=10s;
        server app3.enterpriseids.local:5000 weight=3 max_fails=3 fail_timeout=10s;
        
        # 備用實例 (較低權重)
        server app4.enterpriseids.local:5000 weight=1 backup;
        
        # 健康檢查配置 (NGINX Plus 功能)
        # zone backend 64k;
        
        # 會話持續性配置
        # sticky cookie enterpriseids_server_id expires=1h domain=.enterpriseids.local path=/;
        
        # Keepalive 連線池
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # 健康檢查端點的上游
    upstream health_check_backend {
        server app1.enterpriseids.local:5000 max_fails=1 fail_timeout=5s;
        server app2.enterpriseids.local:5000 max_fails=1 fail_timeout=5s;
        server app3.enterpriseids.local:5000 max_fails=1 fail_timeout=5s;
        keepalive 8;
    }
    
    # SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 包含其他配置檔案
    include /etc/nginx/conf.d/*.conf;
    
    # HTTP 伺服器配置 - 重導向至 HTTPS
    server {
        listen 80;
        server_name enterpriseids.local *.enterpriseids.local;
        
        # 健康檢查端點 (允許 HTTP)
        location /health {
            proxy_pass http://health_check_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 禁用緩存
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            
            access_log off;
        }
        
        # ACME Challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # 其他所有請求重導向至 HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # HTTPS 伺服器配置 - 主要服務
    server {
        listen 443 ssl http2;
        server_name enterpriseids.local;
        
        # SSL 憑證配置
        ssl_certificate /etc/nginx/ssl/enterpriseids.local.crt;
        ssl_certificate_key /etc/nginx/ssl/enterpriseids.local.key;
        ssl_trusted_certificate /etc/nginx/ssl/ca-chain.crt;
        
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # 根路徑和靜態資源
        location / {
            # Rate limiting
            limit_req zone=general burst=20 nodelay;
            
            # 代理設定
            proxy_pass http://enterprise_identity_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket 支援
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # 超時設定
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 緩衝設定
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # 錯誤處理
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
        
        # API 端點特殊配置
        location /api/ {
            # API Rate limiting
            limit_req zone=api burst=50 nodelay;
            
            # CORS 標頭
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
            
            # 處理 OPTIONS 預檢請求
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
            
            proxy_pass http://enterprise_identity_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API 專用超時設定
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # 登入端點特殊配置
        location /Account/Login {
            # 嚴格的 Rate limiting
            limit_req zone=login burst=10 nodelay;
            
            proxy_pass http://enterprise_identity_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 記錄登入嘗試
            access_log /var/log/nginx/login_attempts.log main;
        }
        
        # 靜態資源快取
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://enterprise_identity_backend;
            proxy_set_header Host $host;
            
            # 快取設定
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            
            # 壓縮
            gzip_static on;
            
            access_log off;
        }
        
        # 健康檢查端點
        location /health {
            proxy_pass http://health_check_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 健康檢查不需要快取
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            
            # 快速失敗
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            
            access_log off;
        }
        
        # Blazor SignalR Hub 配置
        location /hubs/ {
            proxy_pass http://enterprise_identity_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SignalR 專用超時設定
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # 保持連接
            proxy_buffering off;
        }
        
        # 錯誤頁面
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /var/www/nginx-default;
        }
        
        location = /404.html {
            root /var/www/nginx-default;
        }
    }
}

# 配置 WebSocket 連接升級
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}