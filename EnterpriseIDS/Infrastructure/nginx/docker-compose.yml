version: '3.8'

services:
  # NGINX 負載平衡器
  nginx-lb:
    image: nginx:1.25-alpine
    container_name: enterpriseids-nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # 監控端點
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./html:/var/www/nginx-default:ro
      - nginx-logs:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - enterpriseids-net
    depends_on:
      - app1
      - app2
      - app3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/nginx_status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    labels:
      - "com.enterpriseids.service=load-balancer"
      - "com.enterpriseids.environment=production"

  # Enterprise Identity Server 實例 1
  app1:
    image: enterpriseids:latest
    container_name: enterpriseids-app1
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db;Database=EnterpriseIDS;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true
      - ConnectionStrings__Redis=redis:6379
      - Redis__InstanceName=EnterpriseIDS
      - DistributedSession__SessionTimeoutHours=8
      - DistributedSession__CleanupIntervalMinutes=60
    ports:
      - "5001:5000"
    networks:
      - enterpriseids-net
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.enterpriseids.service=application"
      - "com.enterpriseids.instance=1"

  # Enterprise Identity Server 實例 2
  app2:
    image: enterpriseids:latest
    container_name: enterpriseids-app2
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db;Database=EnterpriseIDS;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true
      - ConnectionStrings__Redis=redis:6379
      - Redis__InstanceName=EnterpriseIDS
      - DistributedSession__SessionTimeoutHours=8
      - DistributedSession__CleanupIntervalMinutes=60
    ports:
      - "5002:5000"
    networks:
      - enterpriseids-net
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.enterpriseids.service=application"
      - "com.enterpriseids.instance=2"

  # Enterprise Identity Server 實例 3
  app3:
    image: enterpriseids:latest
    container_name: enterpriseids-app3
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db;Database=EnterpriseIDS;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true
      - ConnectionStrings__Redis=redis:6379
      - Redis__InstanceName=EnterpriseIDS
      - DistributedSession__SessionTimeoutHours=8
      - DistributedSession__CleanupIntervalMinutes=60
    ports:
      - "5003:5000"
    networks:
      - enterpriseids-net
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.enterpriseids.service=application"
      - "com.enterpriseids.instance=3"

  # Redis Cluster (分散式快取)
  redis:
    image: redis:7-alpine
    container_name: enterpriseids-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - enterpriseids-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.enterpriseids.service=cache"

  # SQL Server 資料庫
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enterpriseids-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    networks:
      - enterpriseids-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong!Passw0rd -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.enterpriseids.service=database"

  # 監控和日誌收集 (Prometheus + Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: enterpriseids-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - enterpriseids-net
    labels:
      - "com.enterpriseids.service=monitoring"

networks:
  enterpriseids-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  prometheus-data:
    driver: local
  certbot-webroot:
    driver: local